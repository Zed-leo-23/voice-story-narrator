name: Trigger daily Kaggle narration

# This workflow does almost nothing by itself -- it's just the "alarm clock".
# It asks Kaggle's free GPU to run kaggle_kernel/daily-science-narration.py,
# which does the actual fetch -> rewrite -> narrate -> upload -> KakaoTalk work.

on:
  schedule:
    # 21:50 UTC = 06:50 KST. Target delivery is 07:00 KST; this fires 10
    # minutes early as a buffer since generation takes ~3-5 min plus
    # whatever Kaggle's free GPU queue adds. Adjust if delivery drifts.
    - cron: "50 21 * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install six kaggle

      - name: Inject secrets into the kernel script (not committed, local checkout only)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SITE_ID: ${{ secrets.FIREBASE_SITE_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/write_kaggle_secrets.py

      - name: Push and run the Kaggle kernel
        env:
          # Kaggle CLI >=1.8 uses this single-token auth, not username+key.
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: kaggle kernels push -p kaggle_kernel/
