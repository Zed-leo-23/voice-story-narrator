name: Trigger daily Kaggle narration

# This workflow does almost nothing by itself -- it's just the "alarm clock".
# It asks Kaggle's free GPU to run kaggle_kernel/daily-science-narration.py,
# which does the actual fetch -> rewrite -> narrate -> upload -> KakaoTalk work.

on:
  schedule:
    # 20:47 UTC = 05:47 KST, for delivery before 07:00 KST. GitHub starts
    # scheduled runs late (35-47 min late in Nov 2026: 06:50 fired at
    # 07:24-07:37), then Kaggle's free GPU queue and the ~10 min run add more.
    - cron: "47 20 * * *"
  workflow_dispatch:
    inputs:
      story:
        description: "Read this file from automation_state/scripts/ (e.g. dad-octopus.txt) instead of today's news. Leave empty for the news."
        required: false
        default: ""

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install six kaggle

      - name: Inject secrets into the kernel script (not committed, local checkout only)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SITE_ID: ${{ secrets.FIREBASE_SITE_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          # Not a secret: which story file a manual run reads (empty on the schedule).
          STORY_SCRIPT: ${{ inputs.story }}
          # Not a secret: the branch this run was started from. Kaggle clones it,
          # so a story branch can be recorded without merging into main first.
          STORY_BRANCH: ${{ github.ref_name }}
        run: python3 scripts/write_kaggle_secrets.py

      - name: Push and run the Kaggle kernel
        env:
          # Kaggle CLI >=1.8 uses this single-token auth, not username+key.
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: kaggle kernels push -p kaggle_kernel/
